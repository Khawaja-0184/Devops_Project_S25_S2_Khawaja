name: wf-ci-develop
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  linting-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # 1. Missing Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 2. Missing dependency installation
      - name: Install dependencies
        run: npm install
        
      # 3. Linting steps (good)
      - name: Lint HTML Files With HTMLHint
        run: npx htmlhint "**/*.html"
        
      - name: Lint CSS Files With Stylelint
        run: npx stylelint "**/*.css" 
        
      # 4. Fixed typo in step name
      - name: Test Building With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"